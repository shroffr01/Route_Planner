[workspace]
authors = ["Rohan Shroff <rs7aq@virginia.edu>"]
channels = ["conda-forge"]
name = "Route_Planner"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
api = { cmd = "uvicorn app.main:app --reload --port 8000", cwd = "apps/api", env = { PYTHONNOUSERSITE = "1" } }
test = { cmd = "pytest -q -p no:dash", cwd = "apps/api", env = { PYTHONNOUSERSITE = "1" } }
lint = { cmd = "ruff check .", cwd = "apps/api" }
fmt  = { cmd = "ruff format .", cwd = "apps/api" }

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=2.0"
fastapi = ">=0.115"
uvicorn = ">=0.30"
httpx = ">=0.27"
pydantic = ">=2.7"
pydantic-settings = ">=2.4"
redis-py = ">=5.0"
shapely = ">=2.0"
timezonefinder = ">=6.5"
pytz = ">=2024.1"
structlog = ">=24.1"
python-dotenv = ">=1.0"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
respx = ">=0.21"
ruff = ">=0.6"
